name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install application and packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Run tests
        shell: cmd
        run: python -m unittest discover -s tests -v
      - name: Package GhostPrint and MVT
        shell: pwsh
        run: ./platforms/windows/build.ps1
      - name: Build installer
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $compiler)) { throw "Inno Setup 6 could not be installed." }
          & $compiler platforms/windows/GhostPrint.iss
      - name: Smoke-test packaged MVT
        shell: pwsh
        run: '& ".\dist\mvt-ios.exe" --help'
      - name: Create shareable Windows download ZIP
        shell: pwsh
        run: ./platforms/windows/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: GhostPrint-Windows-Installer
          path: dist/GhostPrint-Setup.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: GhostPrint-Windows-Download
          path: dist/GhostPrint-Windows-Download.zip
          if-no-files-found: error
      - name: Publish Windows release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/GhostPrint-Setup.exe
            dist/GhostPrint-Windows-Download.zip
          generate_release_notes: true
